<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compress Photo</title>
  <style>
    :root { color-scheme: light; --bg: #fbfaf8; --text: #171717; --muted: #62666d; --line: #e8e2da; --blue: #0f7cff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top left, rgba(15,124,255,.13), transparent 30rem), radial-gradient(circle at bottom right, rgba(255,45,135,.11), transparent 34rem), var(--bg); color: var(--text); font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif; }
    main { width: min(760px, calc(100% - 32px)); padding: 56px 0; }
    section { background: rgba(255,255,255,.84); border: 1px solid var(--line); border-radius: 30px; box-shadow: 0 22px 60px rgba(20,20,20,.08); padding: clamp(26px, 6vw, 58px); }
    h1 { margin: 0; font-size: clamp(3rem, 11vw, 6.5rem); line-height: .9; letter-spacing: -.07em; }
    p { margin: 1.2rem 0 0; color: var(--muted); font-size: 1.12rem; line-height: 1.6; max-width: 38rem; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 2rem; }
    a { border: 1px solid var(--line); border-radius: 999px; color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: .95rem; font-weight: 700; padding: 12px 18px; text-decoration: none; }
    a:first-child { background: var(--text); border-color: var(--text); color: white; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Compress Photo</h1>
      <p>Compress photos privately on your iPhone. No account, no analytics, no tracking, and no photo uploads.</p>
      <nav>
        <a href="/privacy/">Privacy Policy</a>
        <a href="/support/">Support</a>
      </nav>
    </section>
  </main>
</body>
</html>
